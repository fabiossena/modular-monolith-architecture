# ---------------------------------------------------------------------------
# Modular Monolith Store — docker compose stack.
#
#   docker compose up --build       # start the app on http://localhost:5088
#   docker compose logs -f app      # follow the logs
#   docker compose down             # stop it (the database volume is kept)
#   docker compose down -v          # stop it and wipe the database
#
# Override the published port with:  APP_PORT=8080 docker compose up
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: modular-monolith-store:latest
    container_name: modular-monolith-store
    ports:
      - "${APP_PORT:-5088}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Same "single relational database" as the local run, stored in the volume.
      ConnectionStrings__Sqlite: "Data Source=/app/data/modular-monolith.db"
      # The signing key must be replaced in a real deployment.
      Jwt__Key: "development-only-signing-key-change-me-0123456789-abcdefghijkl"
    volumes:
      - modular-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  modular-data:
